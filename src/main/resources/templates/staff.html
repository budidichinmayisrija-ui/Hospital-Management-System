
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Staff Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fa;
            margin: 30px;
        }

        h1 {
            color: #174a7e;
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 1000px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #174a7e;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #174a7e;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hospital Staff Management System</h1>

    <h2>Register New Staff</h2>

    <form action="/staff" method="post">

        <label>Staff Name</label>
        <input type="text" name="staffName" required>

        <label>Designation</label>
        <input type="text" name="designation" required>

        <label>Department</label>
        <input type="text" name="department" required>

        <label>Phone Number</label>
        <input type="text" name="phone" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Monthly Salary (₹)</label>
        <input type="number" name="salary"
               min="0" step="0.01" required>

        <button type="submit">Save Staff Details</button>

    </form>

    <h2>Hospital Staff Records</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Staff Name</th>
                <th>Designation</th>
                <th>Department</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Salary (₹)</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="staff : ${staffList}">
                <td th:text="${staff.id}"></td>
                <td th:text="${staff.staffName}"></td>
                <td th:text="${staff.designation}"></td>
                <td th:text="${staff.department}"></td>
                <td th:text="${staff.phone}"></td>
                <td th:text="${staff.email}"></td>
                <td th:text="${staff.salary}"></td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
