
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Operation Theatre Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            margin: 30px;
        }

        h1 {
            color: #1b4f72;
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 1100px;
            margin: auto;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 90%;
        }

        button {
            padding: 12px 25px;
            background-color: #1b4f72;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #1b4f72;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Operation Theatre Management System</h1>

    <h2>Add Operation Details</h2>

    <form action="/operations" method="post">

        <input type="text" name="patientName"
               placeholder="Patient Name" required>

        <input type="text" name="operationName"
               placeholder="Operation Name" required>

        <input type="text" name="surgeonName"
               placeholder="Surgeon Name" required>

        <input type="date" name="operationDate" required>

        <input type="time" name="operationTime" required>

        <input type="text" name="status"
               placeholder="Operation Status" required>

        <button type="submit">Save Operation Details</button>

    </form>

    <h2>Operation Records</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Operation Name</th>
                <th>Surgeon Name</th>
                <th>Operation Date</th>
                <th>Operation Time</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="operation : ${operationList}">
                <td th:text="${operation.id}"></td>
                <td th:text="${operation.patientName}"></td>
                <td th:text="${operation.operationName}"></td>
                <td th:text="${operation.surgeonName}"></td>
                <td th:text="${operation.operationDate}"></td>
                <td th:text="${operation.operationTime}"></td>
                <td th:text="${operation.status}"></td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
